name: Remove obsolete Pixel Overlay setup assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-obsolete-release-assets.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete setup executables from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          release_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')"

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            asset_names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$asset_names" | grep -Fxq 'PixelOverlay-Setup.exe'; then
              echo "Removing obsolete PixelOverlay-Setup.exe from release $tag"
              gh release delete-asset "$tag" 'PixelOverlay-Setup.exe' --repo "$GITHUB_REPOSITORY" --yes
            fi
          done <<< "$release_tags"

          echo "Release cleanup complete."

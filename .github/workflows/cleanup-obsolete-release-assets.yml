name: Remove obsolete Pixel Overlay setup assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-obsolete-release-assets.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete setup executables from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t release_tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          for tag in "${release_tags[@]}"; do
            asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$asset_names" | grep -Fxq 'PixelOverlay-Setup.exe'; then
              echo "Removing obsolete PixelOverlay-Setup.exe from release $tag"
              gh release delete-asset "$tag" 'PixelOverlay-Setup.exe' --yes
            fi
          done

          echo "Release cleanup complete."

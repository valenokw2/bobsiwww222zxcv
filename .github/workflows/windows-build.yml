name: Pixel Overlay Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "MSIX version in four-part format, for example 1.0.2.0"
        required: true
        default: "1.0.3.0"
        type: string
      prerelease:
        description: "Publish as a beta/prerelease"
        required: true
        default: true
        type: boolean
      channel:
        description: "Prerelease label, for example beta.1"
        required: false
        default: "beta.1"
        type: string

permissions:
  contents: write

concurrency:
  group: pixel-overlay-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PIXEL_OVERLAY_SIGNING_PFX_BASE64: ${{ secrets.PIXELOVERLAY_SIGNING_PFX_BASE64 }}
      PIXEL_OVERLAY_SIGNING_PFX_PASSWORD: ${{ secrets.PIXELOVERLAY_SIGNING_PFX_PASSWORD }}
      RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
      RELEASE_PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
      RELEASE_CHANNEL_INPUT: ${{ github.event.inputs.channel }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and tag
        id: release
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PIXEL_OVERLAY_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:PIXEL_OVERLAY_SIGNING_PFX_PASSWORD)) {
            throw 'Persistent signing secrets are missing. Run scripts/Initialize-SigningCertificate.ps1 once from a Windows checkout, then start this workflow again.'
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:RELEASE_VERSION_INPUT.Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Version must contain exactly four numeric parts, for example 1.0.2.0.'
            }
            $isPrerelease = $env:RELEASE_PRERELEASE_INPUT -eq 'true'
            if ($isPrerelease) {
              $channel = $env:RELEASE_CHANNEL_INPUT.Trim()
              if ([string]::IsNullOrWhiteSpace($channel) -or $channel -notmatch '^[A-Za-z0-9.-]+$') {
                throw 'A prerelease channel is required and may contain only letters, numbers, dots and hyphens.'
              }
              $tag = "v$version-$channel"
            }
            else {
              $tag = "v$version"
            }
          }
          else {
            $tag = $env:GITHUB_REF_NAME
            $match = [regex]::Match($tag, '^v(?<version>\d+\.\d+\.\d+\.\d+)(?:-(?<channel>[A-Za-z0-9.-]+))?$')
            if (!$match.Success) {
              throw "Invalid release tag '$tag'. Expected v1.2.3.4 or v1.2.3.4-beta.1."
            }
            $version = $match.Groups['version'].Value
            $isPrerelease = $match.Groups['channel'].Success
          }

          foreach ($part in $version.Split('.')) {
            if ([int]$part -gt 65535) { throw "MSIX version component is greater than 65535: $part" }
          }

          $stableAppInstallerUri = 'https://github.com/valenokw2/bobsiwww222zxcv/releases/download/update-channel/PixelOverlay.appinstaller'
          if ($isPrerelease) {
            $appInstallerUri = "https://github.com/valenokw2/bobsiwww222zxcv/releases/download/$tag/PixelOverlay.appinstaller"
            $setupUpdateUri = ''
          }
          else {
            $appInstallerUri = $stableAppInstallerUri
            $setupUpdateUri = $stableAppInstallerUri
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "appinstaller_uri=$appInstallerUri" >> $env:GITHUB_OUTPUT
          "setup_update_uri=$setupUpdateUri" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"
          Write-Host "MSIX version: $version"
          Write-Host "Prerelease: $isPrerelease"

      - name: Prepare package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'Package.appxmanifest'
          $xml = New-Object System.Xml.XmlDocument
          $xml.PreserveWhitespace = $true
          $xml.Load($manifestPath)
          $identity = $xml.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if (!$identity) { throw 'Package.appxmanifest does not contain Package/Identity.' }
          $identity.SetAttribute('Version', $env:RELEASE_VERSION)
          $xml.Save($manifestPath)

      - name: Build signed x64 MSIX package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APPINSTALLER_URI: ${{ steps.release.outputs.appinstaller_uri }}
          RELEASE_SETUP_UPDATE_URI: ${{ steps.release.outputs.setup_update_uri }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'PixelOverlay-Signing.pfx'
          $bytes = [Convert]::FromBase64String($env:PIXEL_OVERLAY_SIGNING_PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          [Array]::Clear($bytes, 0, $bytes.Length)
          $env:PIXEL_OVERLAY_SIGNING_PFX_PATH = $pfxPath

          try {
            $packageOutput = Join-Path $env:RUNNER_TEMP 'PixelOverlay-Packages'
            if (Test-Path $packageOutput) { Remove-Item $packageOutput -Recurse -Force }
            & .\Build-Package.ps1 -Configuration Release -OutputDirectory $packageOutput
            if ($LASTEXITCODE -ne 0) { throw "Build-Package.ps1 failed with exit code $LASTEXITCODE." }

            $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'ReleaseAssets'
            if (Test-Path $assetDirectory) { Remove-Item $assetDirectory -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null

            $mainPackages = @(Get-ChildItem -Path $packageOutput -Recurse -File |
              Where-Object { $_.Extension -in '.msix', '.appx' -and $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
            if ($mainPackages.Count -ne 1) {
              throw "Expected exactly one main MSIX package outside Dependencies; found $($mainPackages.Count)."
            }

            $mainName = "PixelOverlay-$env:RELEASE_VERSION-x64.msix"
            $mainAsset = Join-Path $assetDirectory $mainName
            Copy-Item -LiteralPath $mainPackages[0].FullName -Destination $mainAsset

            # Keep only x64 and neutral framework packages. Release builds may expose a
            # different framework set than Debug builds (for example, .NET Native output).
            $dependencyDirectories = @(Get-ChildItem -Path $packageOutput -Directory -Recurse |
              Where-Object { $_.Name -eq 'Dependencies' })
            $dependencyFiles = @(
              foreach ($directory in $dependencyDirectories) {
                foreach ($architecture in @('x64', 'neutral')) {
                  $architectureDirectory = Join-Path $directory.FullName $architecture
                  if (Test-Path -LiteralPath $architectureDirectory) {
                    Get-ChildItem -Path $architectureDirectory -File |
                      Where-Object { $_.Extension -in '.appx', '.msix' }
                  }
                }
              }
            )

            $dependencyPaths = @()
            $dependencyResourceNames = @()
            $dependencyIndex = 0
            foreach ($dependency in $dependencyFiles) {
              $dependencyIndex++
              $destinationName = $dependency.Name
              $destination = Join-Path $assetDirectory $destinationName
              if (Test-Path -LiteralPath $destination) {
                $destinationName = '{0}.dependency{1}{2}' -f $dependency.BaseName, $dependencyIndex, $dependency.Extension
                $destination = Join-Path $assetDirectory $destinationName
              }
              Copy-Item -LiteralPath $dependency.FullName -Destination $destination
              $dependencyPaths += $destination
              $resourceName = 'PixelOverlayInstaller.Payload.Dependencies.{0:D3}-{1}' -f $dependencyIndex, $destinationName
              $dependencyResourceNames += $resourceName
            }
            Write-Host "Collected $($dependencyPaths.Count) compatible framework package(s) for the installer payload."

            $certificateSource = Join-Path $packageOutput 'PixelOverlay.cer'
            if (!(Test-Path $certificateSource)) {
              $certificateSource = Get-ChildItem -Path $packageOutput -Recurse -Filter 'PixelOverlay.cer' -File |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (!$certificateSource) { throw 'The public signing certificate was not exported.' }
            Copy-Item -LiteralPath $certificateSource -Destination (Join-Path $assetDirectory 'PixelOverlay.cer') -Force

            $appInstallerPath = Join-Path $assetDirectory 'PixelOverlay.appinstaller'
            $appInstallerArgs = @{
              MainPackagePath = $mainAsset
              DependencyPaths = $dependencyPaths
              Version = $env:RELEASE_VERSION
              ReleaseTag = '${{ steps.release.outputs.tag }}'
              RepositoryFullName = 'valenokw2/bobsiwww222zxcv'
              ManifestUri = $env:RELEASE_APPINSTALLER_URI
              OutputPath = $appInstallerPath
            }
            & .\scripts\Build-AppInstaller.ps1 @appInstallerArgs
            if ($LASTEXITCODE -ne 0) { throw 'Build-AppInstaller.ps1 failed.' }

            "RELEASE_ASSET_DIRECTORY=$assetDirectory" >> $env:GITHUB_ENV
            "RELEASE_MAIN_PACKAGE=$mainAsset" >> $env:GITHUB_ENV
            "RELEASE_APPINSTALLER=$appInstallerPath" >> $env:GITHUB_ENV
            "RELEASE_CERTIFICATE=$(Join-Path $assetDirectory 'PixelOverlay.cer')" >> $env:GITHUB_ENV
            "RELEASE_DEPENDENCIES=$($dependencyPaths -join '|')" >> $env:GITHUB_ENV
          }
          finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }

          # Build a self-contained WinForms bootstrapper with all deployment files embedded.
          $installerSource = Join-Path $env:GITHUB_WORKSPACE 'installer\PixelOverlayInstaller.cs'
          $installerScript = Join-Path $env:GITHUB_WORKSPACE 'installer\Install-PixelOverlay.ps1'
          if (!(Test-Path $installerSource) -or !(Test-Path $installerScript)) {
            throw 'The single-file installer source files are missing.'
          }

          $installerCode = Get-Content -LiteralPath $installerSource -Raw
          $installerCode = $installerCode.Replace('__APP_VERSION__', $env:RELEASE_VERSION)
          $installerCode = $installerCode.Replace('__APP_INSTALLER_URI__', $env:RELEASE_SETUP_UPDATE_URI)
          $generatedSource = Join-Path $env:RUNNER_TEMP 'PixelOverlayInstaller.cs'
          [IO.File]::WriteAllText($generatedSource, $installerCode, (New-Object System.Text.UTF8Encoding($false)))

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path -LiteralPath $csc)) { throw 'The .NET Framework C# compiler was not found on the Windows runner.' }

          $setupPath = Join-Path $assetDirectory 'PixelOverlay-Setup.exe'
          $resourceArguments = @(
            "/resource:$mainAsset,PixelOverlayInstaller.Payload.PixelOverlay.msix",
            "/resource:$(Join-Path $assetDirectory 'PixelOverlay.cer'),PixelOverlayInstaller.Payload.PixelOverlay.cer",
            "/resource:$installerScript,PixelOverlayInstaller.Payload.Install-PixelOverlay.ps1"
          )
          foreach ($resourceName in $dependencyResourceNames) {
            $resourceSuffix = $resourceName.Substring('PixelOverlayInstaller.Payload.Dependencies.'.Length)
            $separatorIndex = $resourceSuffix.IndexOf('-')
            if ($separatorIndex -lt 1) { throw "Invalid dependency resource name: $resourceName" }
            $fileName = $resourceSuffix.Substring($separatorIndex + 1)
            $resourcePath = Join-Path $assetDirectory $fileName
            $resourceArguments += "/resource:$resourcePath,$resourceName"
          }
          $compilerArguments = @(
            '/nologo',
            '/target:winexe',
            '/platform:x64',
            '/optimize+',
            "/out:$setupPath",
            '/reference:System.dll',
            '/reference:System.Drawing.dll',
            '/reference:System.Windows.Forms.dll'
          ) + $resourceArguments + @($generatedSource)

          & $csc @compilerArguments
          if ($LASTEXITCODE -ne 0) { throw "Pixel Overlay single-file installer compilation failed with exit code $LASTEXITCODE." }
          if (!(Test-Path -LiteralPath $setupPath) -or (Get-Item -LiteralPath $setupPath).Length -lt 100000) {
            throw 'The embedded setup executable was not created or is unexpectedly small.'
          }

          $signingCertificate = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq 'A68A682C3193352F350F0FC6D7A5F8990863E150' } |
            Select-Object -First 1
          if (!$signingCertificate -or !$signingCertificate.HasPrivateKey) {
            throw 'The persistent Pixel Overlay signing certificate with its private key was not available to sign the setup executable.'
          }
          $setupSignature = Set-AuthenticodeSignature -FilePath $setupPath -Certificate $signingCertificate -HashAlgorithm SHA256
          if (!$setupSignature.SignerCertificate -or $setupSignature.SignerCertificate.Thumbprint -ne $signingCertificate.Thumbprint) {
            throw 'The single-file setup executable could not be signed with the Pixel Overlay publisher certificate.'
          }

          $setupAssembly = [Reflection.Assembly]::LoadFile($setupPath)
          $embeddedResources = @($setupAssembly.GetManifestResourceNames())
          $requiredResources = @(
            'PixelOverlayInstaller.Payload.PixelOverlay.msix',
            'PixelOverlayInstaller.Payload.PixelOverlay.cer',
            'PixelOverlayInstaller.Payload.Install-PixelOverlay.ps1'
          )
          $missingResources = @($requiredResources | Where-Object { $_ -notin $embeddedResources })
          if ($missingResources.Count -gt 0) {
            throw "The setup EXE is missing embedded payload resources: $($missingResources -join ', ')"
          }
          $embeddedDependencyPrefix = 'PixelOverlayInstaller.Payload.Dependencies.'
          $embeddedDependencies = @($embeddedResources | Where-Object { $_.StartsWith($embeddedDependencyPrefix, [StringComparison]::Ordinal) })
          if ($embeddedDependencies.Count -ne $dependencyPaths.Count) {
            throw "Expected $($dependencyPaths.Count) embedded dependency resource(s), found $($embeddedDependencies.Count)."
          }
          Write-Host "Verified $($requiredResources.Count) core resources and $($embeddedDependencies.Count) dynamic dependency resources."

          Write-Host "Created signed self-contained installer: $setupPath"
          Write-Host "Embedded payload size: $((Get-Item -LiteralPath $setupPath).Length) bytes"
          Get-FileHash -Path $setupPath -Algorithm SHA256 | Format-List
          "RELEASE_SETUP_EXE=$setupPath" >> $env:GITHUB_ENV

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $assets = @(
            $env:RELEASE_SETUP_EXE,
            $env:RELEASE_MAIN_PACKAGE,
            $env:RELEASE_APPINSTALLER,
            $env:RELEASE_CERTIFICATE
          )
          if (![string]::IsNullOrWhiteSpace($env:RELEASE_DEPENDENCIES)) {
            $assets += $env:RELEASE_DEPENDENCIES.Split('|')
          }
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) { throw "Release asset is missing: $asset" }
          }

          $notes = (Get-Content -LiteralPath '.\RELEASE-NOTES.md' -Raw).Replace('__VERSION__', $env:RELEASE_VERSION)
          $notesPath = Join-Path $env:RUNNER_TEMP 'PixelOverlay-Release-Notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, (New-Object System.Text.UTF8Encoding($false)))

          $title = "Pixel Overlay v$($env:RELEASE_VERSION)"
          if ($env:RELEASE_PRERELEASE -eq 'true') { $title += ' Beta' }

          $null = gh release view $env:RELEASE_TAG --json tagName 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            & gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed.' }
            if ($env:RELEASE_PRERELEASE -eq 'true') {
              & gh release edit $env:RELEASE_TAG --title $title --notes-file $notesPath --prerelease
            }
            else {
              & gh release edit $env:RELEASE_TAG --title $title --notes-file $notesPath --latest
            }
          }
          else {
            $releaseArgs = @('release', 'create', $env:RELEASE_TAG) + $assets + @(
              '--title', $title, '--notes-file', $notesPath, '--target', $env:GITHUB_SHA
            )
            if ($env:RELEASE_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
            & gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation or update failed.' }

      - name: Publish the stable App Installer manifest
        if: steps.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $feedTag = 'update-channel'
          $feedNotes = Join-Path $env:RUNNER_TEMP 'PixelOverlay-Update-Channel.md'
          $feedNoteText = @"
          Stable App Installer update channel for Pixel Overlay.

          This fixed asset URL is consumed by already-installed clients:
          https://github.com/valenokw2/bobsiwww222zxcv/releases/download/update-channel/PixelOverlay.appinstaller

          Current application release: $env:RELEASE_TAG
          "@
          [IO.File]::WriteAllText($feedNotes, $feedNoteText, (New-Object System.Text.UTF8Encoding($false)))

          $null = gh release view $feedTag --json tagName 2>$null
          $feedExists = $LASTEXITCODE -eq 0

          if ($feedExists) {
            & gh release upload $feedTag $env:RELEASE_APPINSTALLER --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the stable App Installer feed asset.' }
            & gh release edit $feedTag --title 'Pixel Overlay Update Channel' --notes-file $feedNotes --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the stable App Installer feed release.' }
          }
          else {
            $feedArgs = @('release', 'create', $feedTag, $env:RELEASE_APPINSTALLER, '--title', 'Pixel Overlay Update Channel', '--notes-file', $feedNotes, '--target', $env:GITHUB_SHA, '--latest=false')
            & gh @feedArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the stable App Installer feed release.' }
          }

          Write-Host 'Stable update manifest published:'
          Write-Host 'https://github.com/valenokw2/bobsiwww222zxcv/releases/download/update-channel/PixelOverlay.appinstaller'

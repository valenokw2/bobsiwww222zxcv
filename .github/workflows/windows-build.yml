name: PixelOverlay Windows Build
# Packaging workflow is validated on pull requests and main pushes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare package signing certificate
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=PixelOverlayDeveloper" `
            -KeyUsage DigitalSignature `
            -FriendlyName "PixelOverlay CI Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $password = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          $pfxPath = Join-Path $env:RUNNER_TEMP "PixelOverlay-CI.pfx"
          $cerPath = Join-Path $env:GITHUB_WORKSPACE "PixelOverlay.cer"

          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

          "PACKAGE_CERTIFICATE=$pfxPath" >> $env:GITHUB_ENV
          "PACKAGE_CERTIFICATE_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build and package PixelOverlay
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\AppPackages"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          msbuild .\PixelOverlay.sln `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageDir="$packageDir\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$env:PACKAGE_CERTIFICATE" `
            "/p:PackageCertificatePassword=$env:PACKAGE_CERTIFICATE_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild packaging failed with exit code $LASTEXITCODE"
          }

          $packages = Get-ChildItem -Path $packageDir -Recurse -File |
            Where-Object { $_.Extension -in @(".appx", ".msix") -and $_.FullName -notmatch "[\\/]Dependencies[\\/]" }

          if (-not $packages) {
            throw "MSBuild completed but no installable .appx/.msix package was produced."
          }

          $dependencies = Get-ChildItem -Path $packageDir -Recurse -File |
            Where-Object { $_.Extension -in @(".appx", ".msix") -and $_.FullName -match "[\\/]Dependencies[\\/]" }

          Write-Host "Main package(s):"
          $packages | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Framework dependencies:"
          $dependencies | ForEach-Object { Write-Host $_.FullName }

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "PixelOverlay.cer") -Destination $packageDir

      - name: Upload installable package and dependencies
        uses: actions/upload-artifact@v4
        with:
          name: PixelOverlay-Windows-x64
          path: artifacts/AppPackages/
          if-no-files-found: error
          retention-days: 14
